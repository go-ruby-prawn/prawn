name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Build, vet, race-test and enforce 100% coverage on the three host OSes. The
  # suite is fully self-contained: it generates PDFs in memory and parses them
  # back with the pure-Go rsc.io/pdf reader, so no Ruby runtime, no C PDF library
  # and no network access are required on any lane.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # ⛔ The differential tests here compare this package against a LIVE
      # MRI, and nothing installed one. They skipped on every lane, always,
      # and a skip is green.
      #
      # Not on Windows: there is no MRI there and the tests say so.
      - if: runner.os != 'Windows'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # The live-gem oracle wants the real library, not just an interpreter.
      - if: runner.os != 'Windows'
        run: gem install --no-document prawn pdf-reader

      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Verify the library is CGO-free
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build ./... && go vet ./...
      # The race detector needs cgo, so this lane keeps CGO enabled; the CGO-free
      # guarantee is enforced by the step above and by the CGO_ENABLED=0 arch
      # lanes below.
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          # ⛔ -v and a tee, so the guard below has something to read. Without
          # -v there are no `--- SKIP` lines at all, and counting zero of them
          # looks exactly like counting zero because nothing skipped. -count=1
          # because installing a program does not invalidate the Go test cache:
          # exec.LookPath only stats, so `ok (cached)` can replay a run recorded
          # before ruby existed on the machine.
          set -o pipefail
          go test -count=1 -v -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./... 2>&1 | tee test-output.txt
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

      # The oracle's only skip reason is a missing or too-old interpreter, so
      # its presence means the differential test did not happen.
      - name: the MRI oracle must have judged
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if grep -q "ruby prawn+pdf-reader not available" test-output.txt; then
            echo "::error::the MRI oracle skipped; the differential test did not run"
            exit 1
          fi

  # Validate the library on the six supported 64-bit targets. amd64/arm64 run
  # natively; the rest run the suite under qemu-user. PDF output is a
  # byte-oriented format and every dependency (fpdf, image/png, image/jpeg,
  # rsc.io/pdf) is pure Go, so the big-endian s390x lane exercises the exact same
  # code path as the little-endian ones.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - env:
          CGO_ENABLED: "0"
        run: go env GOARCH && go test -timeout 120s ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
        run: go test -timeout 600s -exec=${{ matrix.qemu }} ./...

  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [js, wasip1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build ${{ matrix.goos }}/wasm
        run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...
